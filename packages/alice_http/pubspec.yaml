  flutter: ">=3.29.0"

dependencies:
  alice: ^1.8.0
  http: ^1.4.0

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.25.15
  alice_test: ^1.1.1
  mocktail: ^1.0.4
