name: alice_http
description: "HTTP interceptor and network logger for Alice. Inspect, log, and debug http package requests and responses in a native Flutter UI."
documentation: https://jhomlala.github.io/alice/
version: 1.4.0
repository: https://github.com/jhomlala/alice
issue_tracker: https://github.com/jhomlala/alice/issues
homepage: https://github.com/jhomlala/alice
resolution: workspace
topics:
  - http
  - interceptor
  - logger
  - network
  - rest

environment:
