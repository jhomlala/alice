name: alice_dio
description: "Dio interceptor and network logger for Alice. Inspect, log, and debug Dio HTTP requests and responses in a native Flutter UI."
documentation: https://jhomlala.github.io/alice/
version: 1.3.1

resolution: workspace
topics:
  - dio
  - interceptor
  - logger
  - network
  - http

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  alice: ^1.9.0
  dio: ^5.8.0+1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.25.15
  mocktail: ^1.0.4
  http_mock_adapter: ^0.6.1
  alice_test: ^1.1.1
