name: alice_chopper
description: "Chopper interceptor and network logger for Alice. Inspect, log, and debug Chopper HTTP requests and responses in a native Flutter UI."
documentation: https://jhomlala.github.io/alice/
version: 1.3.1
repository: https://github.com/jhomlala/alice
issue_tracker: https://github.com/jhomlala/alice/issues
homepage: https://github.com/jhomlala/alice
resolution: workspace
topics:
  - chopper
  - interceptor
  - logger
  - network
  - http

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  alice: ^1.9.0
  chopper: ^8.2.0
  http: ^1.4.0
  uuid: ^4.5.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  test: ^1.25.15
  alice_test: ^1.1.1
  mocktail: ^1.0.4
  build_runner: ^2.5.4
  chopper_generator: ^8.2.0
  json_serializable: ^6.9.5
  json_annotation: ^4.9.0
  equatable: ^2.0.7
