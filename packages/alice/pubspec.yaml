name: alice
description: An advanced HTTP inspector for Flutter that logs network requests and responses, providing a rich native UI for seamless API debugging.
icon: assets/pub/logo.png
documentation: https://jhomlala.github.io/alice/
version: 1.7.1
homepage: https://github.com/jhomlala/alice
repository: https://github.com/jhomlala/alice
resolution: workspace
topics:
  - http
  - inspector
  - dio
  - chopper
  - interceptor

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  material_ui: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.1
  rxdart: ^0.28.0
  path_provider: ^2.1.5
  permission_handler: ^13.0.2
  package_info_plus: ^10.2.1
  open_file: ^4.0.0
  sensors_plus: ^7.1.0
  share_plus: ^13.3.0
  collection: ^1.19.1
  url_launcher: ^6.3.2
  equatable: ^2.0.7

  cupertino_ui: ^1.0.2
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
  test: ^1.25.15
  mocktail: ^1.0.4
