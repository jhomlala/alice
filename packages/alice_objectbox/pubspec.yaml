name: alice_objectbox
description: "ObjectBox persistent storage plugin for Alice. Store HTTP requests and responses in a local NoSQL database for offline inspection and debugging."
documentation: https://jhomlala.github.io/alice/
version: 1.3.2
repository: https://github.com/jhomlala/alice
issue_tracker: https://github.com/jhomlala/alice/issues
homepage: https://github.com/jhomlala/alice
resolution: workspace
topics:
  - objectbox
  - storage
  - database
  - inspector
  - logger

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  alice: ^1.10.0
  json_annotation: ^4.9.0
  meta: ^1.16.0
  objectbox: ^5.3.2
  objectbox_flutter_libs: ^5.3.2
  path: ^1.9.1
  path_provider: ^2.1.5
  flat_buffers: ^25.9.23

dev_dependencies:
  build_runner: ^2.4.1
  flutter_lints: ^6.0.0
  json_serializable: ^6.9.5
  objectbox_generator: ^5.3.2
